<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7b2ff7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feFlood flood-color="#00d4ff" flood-opacity="0.6" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="typewriter">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width" from="0" to="800" dur="2.5s" fill="freeze" begin="0.3s" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1" />
      </rect>
    </clipPath>
  </defs>
  
  <rect width="800" height="200" rx="12" fill="#0d1117" />
  
  <rect x="0" y="195" width="800" height="5" rx="2" fill="url(#glow)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <g clip-path="url(#typewriter)">
    <text x="400" y="95" text-anchor="middle" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="72" font-weight="700" fill="url(#glow)" filter="url(#neon)">
      VS Code FX
    </text>
    <text x="400" y="145" text-anchor="middle" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#8b949e" letter-spacing="4">
      PREMIUM ANIMATIONS FOR VS CODE
    </text>
  </g>

  <line x1="688" y1="60" x2="688" y2="155" stroke="#00d4ff" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1.2s" repeatCount="indefinite" begin="2.8s" />
  </line>
</svg>
